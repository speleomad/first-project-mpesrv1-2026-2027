<p>comment works!</p>
<div *ngIf="comments.length>0 ; else noComments">
    <h3>Messages</h3>
    <ul class="list-group">
        <ng-container *ngFor="let comment of comments; let i=index; let isEven=even">
            <li class="list-group-item d-flex justify-content-between align-items-center" *ngIf="isEven">

                {{i}}-- {{comment.message}}<span class="badge badge-secondary badge-pill">{{comment.date |date:'HH:mm:ss'}}</span>
            </li>
        </ng-container>

    </ul>
</div>

<ng-template #noComments>
    <p>No Comments</p>
</ng-template>
